<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f4f4f4" />
  <title>Runway Walk · Jiiwon Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header><h1>한 걸음, 여러 사람</h1><span>RUNWAY WALK — COLOR / FOOTFALL</span></header>
  <main class="stage">
    <figure>
      <video id="walk" autoplay loop muted playsinline preload="auto" aria-label="색의 흐름에 따라 인물이 바뀌는 런웨이 콜라주"></video>
      <figcaption id="primary-label">01 · 색의 흐름</figcaption>
    </figure>
    <figure id="companion" hidden>
      <video id="footfall" loop muted playsinline preload="auto" aria-label="발을 디딜 때 인물이 바뀌는 런웨이 콜라주"></video>
      <figcaption>03 · 발 디딤</figcaption>
    </figure>
    <p id="status" role="status">영상을 불러오는 중…</p>
  </main>
  <footer>
    <div class="modes" role="group" aria-label="작품 버전">
      <button type="button" data-mode="color" aria-pressed="false">색의 흐름</button>
      <button type="button" data-mode="footfall" aria-pressed="false">발 디딤</button>
      <button type="button" data-mode="compare" aria-pressed="true">나란히 비교</button>
      <button type="button" data-mode="frame" aria-pressed="false">기존 · 매 프레임</button>
      <button type="button" data-mode="step" aria-pressed="false">기존 · 3프레임</button>
    </div>
    <div class="transport">
      <button id="toggle" type="button" aria-label="일시정지">Ⅱ</button>
      <button id="previous" type="button" aria-label="이전 프레임">←</button>
      <input id="frame" type="range" min="0" max="179" value="0" disabled aria-label="프레임 탐색" />
      <button id="next" type="button" aria-label="다음 프레임">→</button>
      <output id="position">001 / 180</output>
      <select id="speed" aria-label="재생 속도"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
    </div>
    <div class="links"><a id="download" download="runway-color.mp4">색의 흐름 MP4 ↗</a><a id="download-footfall" download="runway-footfall.mp4" hidden>발 디딤 MP4 ↗</a><a href="https://www.youtube.com/watch?v=qcE5NeDUvIk" target="_blank" rel="noreferrer">원본 · Louis Vuitton ↗</a></div>
  </footer>
  <script type="module" src="./script.ts"></script>
</body>
</html>
