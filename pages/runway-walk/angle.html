<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#d8d6d0" />
  <title>Runway Walk</title>
  <link rel="stylesheet" href="./angle.css" />
</head>
<body>
  <main id="surface" role="slider" tabindex="0" aria-label="몸의 방향" aria-orientation="horizontal" aria-valuemin="-90" aria-valuemax="90" aria-valuenow="0" aria-keyshortcuts="ArrowLeft ArrowRight Home Space" aria-busy="true">
    <div class="halo" aria-hidden="true"></div>
    <canvas id="person" width="512" height="768" aria-hidden="true"></canvas>
    <output id="direction" aria-hidden="true">0°</output>
  </main>
  <p id="status" class="sr-only" role="status"></p>
  <script type="module" src="./angle.ts"></script>
  <script type="module" src="/common/touch-pointer.ts"></script>
</body>
</html>
