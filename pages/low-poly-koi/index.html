<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ce9">
  <meta name="description" content="그려서 만들고, 선택해서 움직이는 잉어 연못. ASCII와 로우폴리 표현으로 즐겨 보세요.">
  <title>Low Poly Koi · Jiiwon Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas aria-label="더블클릭한 곳을 피해 헤엄치는 아스키아트 잉어 열 마리"></canvas>
  <svg class="sketch" aria-hidden="true"><path /></svg>
  <div class="hover-outline" aria-hidden="true" hidden></div>
  <div class="selection" hidden>
    <button type="button" data-corner="nw" aria-label="왼쪽 위 모서리로 크기 조절"></button>
    <button type="button" data-corner="ne" aria-label="오른쪽 위 모서리로 크기 조절"></button>
    <button type="button" data-corner="sw" aria-label="왼쪽 아래 모서리로 크기 조절"></button>
    <button type="button" data-corner="se" aria-label="오른쪽 아래 모서리로 크기 조절"></button>
    <button type="button" data-delete aria-label="물고기 삭제" title="물고기 삭제"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M9 7V4h6v3 M6 7l1 14h10l1-14 M10 10v8 M14 10v8"/></svg></button>
  </div>
  <div class="editor-tools" role="group" aria-label="물고기 편집 도구">
    <button type="button" data-tool="select" aria-label="선택" aria-pressed="false" title="선택 (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 14 10-7 1-3 7Z"/></svg></button>
    <button type="button" data-tool="draw" aria-label="그리기" aria-pressed="false" title="그리기 (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4-1L20 7l-4-4L4 15Z M13 6l4 4"/></svg></button>
    <button type="button" data-tool="swim" aria-label="헤엄치기" aria-pressed="true" title="선택 해제하고 모두 헤엄치기 (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 4 14 8-14 8Z"/></svg></button>
    <span class="tool-divider"></span>
    <button type="button" data-undo aria-label="실행 취소" title="실행 취소 (⌘Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-5 5 5 5 M3 10h10a7 7 0 0 1 7 7"/></svg></button>
    <button type="button" data-redo aria-label="다시 실행" title="다시 실행 (⌘⇧Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 5 5 5-5 5 M21 10h-10a7 7 0 0 0-7 7"/></svg></button>
  </div>
  <p class="editor-status" role="status" aria-live="polite"></p>
  <p class="error" role="alert" hidden>이 작품을 보려면 WebGL을 지원하는 브라우저가 필요해요.</p>
  <script type="module" src="./script.ts"></script>
</body>
</html>
